<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAPTIK VIP - Telegram Media Downloader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0f17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(23, 27, 40, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            color: #000;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        h1 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #a0aec0;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #4ade80;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .features {
            text-align: right;
            margin-bottom: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 15px;
            color: #e2e8f0;
        }

        .feature-item i {
            color: #ffd700;
            font-size: 18px;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(45deg, #0088cc, #00aaff);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .btn-telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="vip-badge"><i class="fas fa-crown"></i> VIP EDITION</span>
        <h1>SNAPTIK BOT</h1>
        <p class="subtitle">بۆتێ دەستپێشخەر بۆ داگرتنا ڤیدیۆیان ل تۆڕێن کۆمەڵایەتی</p>

        <div class="status-container">
            <span class="status-dot"></span>
            <span>سێرڤەر ئۆنلاینە (24/7 Active)</span>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fas fa-check-circle"></i>
                <span>داگرتنا ڤیدیۆیێن TikTok, Instagram, YouTube</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-bolt"></i>
                <span>کوالیتییا 4K Ultra HD بۆ هەژمارێن VIP</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-shield-alt"></i>
                <span>خێرایییا بێسنور و ب بێ ریپۆرت/لۆدینگ</span>
            </div>
        </div>

        <a href="https://t.me/Snaptik_bot" class="btn-telegram" target="_blank">
            <i class="fab fa-telegram-plane"></i>
            دەستپێکرن ل تێلیگرامێ
        </a>

        <footer>&copy; 2026 SNAPTIK Media Bot - All Rights Reserved</footer>
    </div>

</body>
</html>
